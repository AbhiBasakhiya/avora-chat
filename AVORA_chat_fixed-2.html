<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AVORA Realtime Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      min-height: 100dvh;
      max-width: 650px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 16px 12px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    h2 {
      margin: 0;
      color: #6d68ff;
      font-size: 22px;
    }

    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #888;
    }

    #status.ok { color: #4ade80; }
    #status.error { color: #f87171; }

    #chat-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      padding: 10px 13px;
      background: #252525;
      border-radius: 10px;
      word-break: break-word;
      max-width: 90%;
    }

    .empty {
      margin: auto;
      color: #777;
      text-align: center;
    }

    .input-container {
      display: flex;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: #181818;
      border-top: 1px solid #292929;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      outline: none;
    }

    input:focus { border-color: #6d68ff; }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    button:disabled { opacity: .55; }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h2>AVORA Chat</h2>
      <div id="status">Connecting to Supabase...</div>
    </header>

    <main id="chat-box">
      <div class="empty">Loading messages...</div>
    </main>

    <form class="input-container" id="chat-form">
      <input
        type="text"
        id="message-input"
        placeholder="Type a message..."
        autocomplete="off"
        maxlength="2000"
      >
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    // ------------------------------------------------------------
    // AVORA / SUPABASE CONFIG
    // ------------------------------------------------------------
    const SUPABASE_URL = "https://ubhqjnxwppjeyxouhzzb.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViaHFqbnh3cHBqZXl4b3VoenpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEwMDM5NjksImV4cCI6MjA1NjU3OTk2OX0.vWp3g8-G-T6d_wO4Y9bKx8n4l7m2x0c1v3b5n7m9l1k";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const form = document.getElementById("chat-form");
    const statusEl = document.getElementById("status");

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = type;
    }

    function clearEmpty() {
      const empty = chatBox.querySelector(".empty");
      if (empty) empty.remove();
    }

    function appendMessage(text) {
      if (!text) return;

      clearEmpty();

      const div = document.createElement("div");
      div.className = "message";
      div.textContent = text; // safe: does not interpret HTML
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showError(prefix, error) {
      console.error(prefix, error);

      const message =
        error?.message ||
        error?.details ||
        error?.hint ||
        "Unknown error";

      setStatus(prefix, "error");
      console.error("Details:", message);
    }

    async function fetchMessages() {
      try {
        const { data, error } = await client
          .from("messages")
          .select("message");

        if (error) throw error;

        chatBox.innerHTML = "";

        if (!data || data.length === 0) {
          chatBox.innerHTML =
            '<div class="empty">No messages yet.</div>';
        } else {
          data.forEach(row => appendMessage(row.message));
        }

        setStatus("Database connected", "ok");
      } catch (error) {
        chatBox.innerHTML =
          '<div class="empty">Could not load messages. Check Supabase RLS/table settings.</div>';

        showError("Database connection failed", error);
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      sendBtn.disabled = true;

      try {
        const { error } = await client
          .from("messages")
          .insert({ message: text });

        if (error) throw error;

        input.value = "";
        input.focus();
      } catch (error) {
        showError("Message send failed", error);
        alert(
          "Message could not be sent.\n\n" +
          (error?.message || "Unknown error")
        );
      } finally {
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });

    // Realtime INSERT listener
    client
      .channel("avora-messages")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {
          if (payload?.new?.message) {
            appendMessage(payload.new.message);
          }
        }
      )
      .subscribe(realtimeStatus => {
        console.log("Realtime status:", realtimeStatus);

        if (realtimeStatus === "SUBSCRIBED") {
          setStatus("Connected • Realtime ON", "ok");
        } else if (realtimeStatus === "CHANNEL_ERROR") {
          setStatus("Realtime error — check Realtime settings", "error");
        } else if (realtimeStatus === "TIMED_OUT") {
          setStatus("Realtime timed out", "error");
        }
      });

    fetchMessages();
  </script>
</body>
</html>
